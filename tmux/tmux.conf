set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g default-shell "/bin/zsh"

set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'wfxr/tmux-net-speed'
set -g @tmux_power_theme 'everforest'
set -g @tmux_power_date_icon ' '
set -g @tmux_power_time_icon ' '
set -g @tmux_power_user_icon ' '
set -g @tmux_power_session_icon ' '
set -g @tmux_power_show_upload_speed    true
set -g @tmux_power_show_download_speed  true
set -g @tmux_power_show_web_reachable   true
set -g @tmux_power_right_arrow_icon     ''
set -g @tmux_power_left_arrow_icon      ''
set -g @tmux_power_upload_speed_icon    '󰕒'
set -g @tmux_power_download_speed_icon  '󰇚'
set -g @tmux_power_prefix_highlight_pos 'R'
set -g @tmux_power_show_upload_speed true
set -g @tmux_power_show_download_speed true
set -g @tmux_power_prefix_highlight_pos 'LR'
set -g @tmux_power_show_web_reachable true

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g detach-on-destroy off

set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 100000
set -sg escape-time 10

set -g extended-keys on
set -g extended-keys-format csi-u

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

unbind p
bind p previous-window

bind r source-file "#{HOME}/.config/tmux/tmux.conf" \;\
  display-message "tmux configuration reloaded"

bind a new-window -n agent -c "#{pane_current_path}" \
  "opencode --port --agent engineer"
bind R new-window -n research -c "#{pane_current_path}" \
  "opencode --agent research"
bind g new-window -n git -c "#{pane_current_path}" "lazygit"
bind t new-window -n test -c "#{pane_current_path}"
bind f run-shell "tmux new-window -n sessions '#{HOME}/.local/bin/tmux-sessionizer'"
bind X confirm-before -p "Kill session #S? (y/n)" "kill-session"

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[default] "
set -g status-right "#[fg=#6c7086]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#cdd6f4]%Y-%m-%d %H:%M "
setw -g window-status-format \
  " #[fg=#7f849c]#I:#{pane_current_command} "
setw -g window-status-current-format \
  " #[fg=#1e1e2e,bg=#a6e3a1,bold]#I:#{pane_current_command} "
setw -g window-status-activity-style "fg=#f9e2af,bold"
set -g monitor-activity on
set -g visual-activity off

set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "sainnhe/tmux-fzf"

set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "off"
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"

# Copy the SSH agent environment variable into new windows/panes
set -g update-environment "SSH_AUTH_SOCK SSH_ASKPASS SSH_GATEWAY SSH_CONNECTION"

if-shell -b "[ -x /usr/share/tmux-plugin-manager/tpm ]" \
  "run-shell /usr/share/tmux-plugin-manager/tpm"
